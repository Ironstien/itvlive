# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render: New → Blueprint → select your GitHub repo.
services:
  - type: web
    name: itvlive
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Required for login/register (Phase 2A) — set value in Render Dashboard, not in git
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
