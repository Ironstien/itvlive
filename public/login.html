<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTO THE VOID — Log in</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="page-auth">
    <header class="site-nav">
      <div class="site-logo">
        <span class="site-logo-text">INTO THE VOID</span>
        <span class="site-version" aria-label="Site version"></span>
      </div>
      <ul class="nav-links">
        <li><a href="/home.html">Home</a></li>
        <li><a href="/about.html">About Us</a></li>
        <li><a href="/index.html">Main Stage</a></li>
      </ul>
      <div class="nav-user" id="nav-user"></div>
    </header>

    <main class="page-main auth-main">
      <div class="auth-card">
        <h1>Enter your account</h1>
        <p class="auth-lead">Save playlists, show your avatar in chat and the Vinyl Pit.</p>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-tab="login" role="tab">Log in</button>
          <button type="button" class="auth-tab" data-tab="register" role="tab">Register</button>
        </div>

        <p id="auth-error" class="auth-error hidden" role="alert"></p>

        <form id="form-login" class="auth-form" data-pane="login">
          <label>
            Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>
            Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn-primary">Log in</button>
        </form>

        <form id="form-register" class="auth-form hidden" data-pane="register">
          <label>
            Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>
            Username
            <input
              type="text"
              name="username"
              required
              minlength="2"
              maxlength="24"
              pattern="[a-zA-Z0-9_-]{2,24}"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </label>
          <small class="field-hint">2–24 characters: letters, numbers, _ or -</small>
          <label>
            Password
            <input
              type="password"
              name="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>
          <small class="field-hint">At least 8 characters</small>
          <button type="submit" class="btn-primary">Create account</button>
        </form>

        <p class="auth-footer">
          <a href="/index.html">Continue as guest on Main Stage</a> (listen &amp; chat with a display name)
        </p>
      </div>
    </main>

    <script src="/js/version.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
